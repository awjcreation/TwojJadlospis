<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#237a32">
  <meta name="description" content="PWA do planowania jadłospisów, przepisów, produktów i listy zakupów.">
  <title>Twój jadłospis</title>
  <link rel="manifest" href="./manifest.json?v=1.0.8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0">
  <link rel="stylesheet" href="./styles.css?v=1.0.8">
    <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Twój jadłospis">
</head>
<body>
  <noscript>Ta aplikacja wymaga włączonego JavaScriptu.</noscript>

  <div id="app" class="app-shell"></div>

  
  <nav class="bottom-nav" aria-label="Główna nawigacja">
    <div class="bottom-nav-inner nav-three">
      <button class="nav-item nav-main" data-route="today" type="button">
        <span class="nav-plate"><span class="material-symbols-rounded">restaurant</span></span>
        <span>Twój jadłospis</span>
      </button>

      <button class="nav-item" data-route="shopping" type="button">
        <span class="material-symbols-rounded nav-icon">shopping_cart</span>
        <span>Lista zakupów</span>
      </button>

      <button class="nav-item" data-route="library" type="button">
        <span class="material-symbols-rounded nav-icon">menu_book</span>
        <span>Zasoby</span>
      </button>

      <button class="nav-item nav-settings" data-route="settings" type="button">
        <span class="material-symbols-rounded nav-icon">settings</span>
        <span>Ustawienia</span>
      </button>
    </div>
  </nav>

  <div id="modalRoot"></div>
  <script src="./app.js?v=1.0.8"></script>

  <input
    id="recipe-import-input"
    type="file"
    accept=".json"
    hidden
  >

  <input id="resource-import-input" type="file" accept=".json,application/json,text/json" hidden>
</body>
</html>
